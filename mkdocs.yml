site_name: Grassmann Reference
site_description: Node-by-node reference for the Grassmann IR (spaces, terms, bases).
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      toggle: {icon: material/weather-night, name: Dark}
    - scheme: slate
      primary: indigo
      toggle: {icon: material/weather-sunny, name: Light}
exclude_docs: |
  _authored/
extra_javascript:
  - js/review.js
  - js/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex: {generic: true}
  - tables
  - toc: {permalink: true}
nav:
  - Home: index.md
  - Definitions: definitions.md
  - Bases guide: bases-guide.md
  - Target basis roadmap: target-basis-roadmap.md
  - Testing: testing.md
  - Auditing: auditing.md
  - Design problems: design-problems.md
  - Spaces:
    - Overview: spaces/index.md
    - scalar: spaces/scalar.md
    - s-var: spaces/s-var.md
    - dual: spaces/dual.md
    - o-plus: spaces/o-plus.md
