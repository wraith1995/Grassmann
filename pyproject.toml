[project]
name = "grassmann"
version = "0.1.0"
description = "Grassmann — typed, coordinate-free linear-algebra core IR (kinds/spaces/types/terms/bases), lowered to polyarray."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Thea Collin", email = "teoc@mit.edu" },
]
# polyarray is the IW4 lowering target; the IW1 core datatypes do not import it
# at runtime, but we declare the dependency now so the package graph is correct.
dependencies = [
    "polyarray",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.1",
    "mypy>=1.13",
]
# chartlib is the modern geometry/manifold oracle used to cross-check Grassmann's
# coordinate-free exterior algebra against an independent geometric setting
# (charts, tangent frames, Jacobian volume). Test-only — never a runtime dep.
test = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.1",
    "chartlib",
    # scipy.linalg.expm builds the closed-form geodesic frame Q(x)=expm((c·x)·A)·Q₀ used by
    # tests/test_diff_analytic.py as an EXACT (non-FD) reference for the gauge-aware FFS AD.
    "scipy>=1.10",
]
# Reference doc site (tools/gen_docs.py + mkdocs). Build with `mkdocs build`, preview
# with `mkdocs serve`. Doc-only — never a runtime dep.
docs = [
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
polyarray = { path = "../polyarray", editable = true }
chartlib = { path = "../chartlib", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"          # parallel by default (pytest-xdist); ~5.5min serial → ~1min. Override with `-n0`.
# Per-test wall-clock budget (pytest-timeout; §E1 blow-up blocker-avoidance): a symbolic/IR blow-up
# then FAILS FAST at the budget instead of hanging/OOMing the suite. `thread` method (no SIGALRM —
# avoids clashing with the torch 1-rank / MASTER_PORT setup, per polyarray). 300 s is generous (≫ any
# legit single test — the whole suite is ~1 min under xdist — ≪ a real blow-up, which is OOM/40 min);
# TIGHTEN to ~2× the slowest with `--durations` data (the oracle pattern) as a follow-up. Override ad
# hoc with `--timeout=N`; a genuinely-heavier test raises its own bar with `@pytest.mark.timeout(N)`.
timeout = 300
timeout_method = "thread"
markers = [
    "network: test hits a live external service (matrixcalculus.org); opt-in, off by default",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
extend-select = ["UP", "I", "D", "ANN"]
extend-ignore = [
    "D105",   # magic methods: the language fixes their meaning
    "D107",   # __init__: documented by the class docstring
    "D203",   # incompatible with D211 (no blank line before a class docstring)
    "D213",   # summary starts on the first line, not the second
]

[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
strict_optional = true

# ---------------------------------------------------------------------------
# Documentation + annotation gate: `make lint-docs`. Deliberately narrow — it
# enforces the docstring and typing contract, not general style.
# ---------------------------------------------------------------------------
[tool.ruff.lint.pydocstyle]
convention = "numpy"

# numpydoc validation: consistency, not completeness — whatever sections a
# docstring declares must match the signature.
[tool.numpydoc_validation]
checks = [
    "GL06",  # unknown section name
    "GL07",  # sections out of order
    "GL09",  # deprecation warning misplaced
    "SS03",  # summary lacks a period
    "PR02",  # a documented parameter that is not in the signature
    "PR03",  # documented parameters out of signature order
    "RT02",  # return section names a variable where it should give a type
]
# Module docstrings carry free-form prose sections (Sphinx renders them); the
# section vocabulary above applies to callables and classes only.
exclude = [
    '^[A-Za-z_][A-Za-z_0-9]*$',  # the module node itself (an undotted name)
    '\.__init__$',
    '\.__repr__$',
    '\.__eq__$',
]

# Modules still awaiting the docstring/annotation sweep. This list only shrinks;
# adding an entry needs a reason.
[tool.ruff.lint.per-file-ignores]
# __init__.py intentionally re-exports the public API.
"__init__.py" = ["F401"]

"tests/**" = ["D", "ANN"]
"src/grassmann/core/basis.py" = ["D", "ANN"]
"src/grassmann/core/space.py" = ["D", "ANN"]
"src/grassmann/core/term.py" = ["D", "ANN"]
