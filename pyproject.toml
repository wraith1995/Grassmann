[project]
name = "grassmann"
version = "0.1.0"
description = "Grassmann — typed, coordinate-free linear-algebra core IR (kinds/spaces/types/terms/bases), lowered to polyarray."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "teocollin1995", email = "teoc@mit.edu" },
]
# polyarray is the IW4 lowering target; the IW1 core datatypes do not import it
# at runtime, but we declare the dependency now so the package graph is correct.
dependencies = [
    "polyarray",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "mypy>=1.13",
]
# chartlib is the modern geometry/manifold oracle used to cross-check Grassmann's
# coordinate-free exterior algebra against an independent geometric setting
# (charts, tangent frames, Jacobian volume). Test-only — never a runtime dep.
test = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "chartlib",
    # scipy.linalg.expm builds the closed-form geodesic frame Q(x)=expm((c·x)·A)·Q₀ used by
    # tests/test_diff_analytic.py as an EXACT (non-FD) reference for the gauge-aware FFS AD.
    "scipy>=1.10",
]
# Reference doc site (tools/gen_docs.py + mkdocs). Build with `mkdocs build`, preview
# with `mkdocs serve`. Doc-only — never a runtime dep.
docs = [
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
polyarray = { path = "../polyarray", editable = true }
chartlib = { path = "../chartlib", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"          # parallel by default (pytest-xdist); ~5.5min serial → ~1min. Override with `-n0`.
markers = [
    "network: test hits a live external service (matrixcalculus.org); opt-in, off by default",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
extend-select = ["UP", "I"]

[tool.ruff.lint.per-file-ignores]
# __init__.py intentionally re-exports the public API.
"__init__.py" = ["F401"]

# mypy — chartLib's config is the model (fem CLAUDE.md rule 3); run: .venv/bin/mypy
[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
strict_optional = true
