name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Exhaustive-dispatch / lowering audit
        run: python audit/run.py --min-severity ERROR   # pure-stdlib, no install needed

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[test]"
      - name: Run tests
        # Skip live-service tests; raise the per-test timeout for CI's slower cores — the strict
        # 300s blow-up guard in pyproject stays the local default, overridden here for CI only.
        run: pytest -n auto -q -m "not network" --timeout=900

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[docs]"
      - name: Build docs + run doctests
        run: |
          make -C docs html
          make -C docs doctest
